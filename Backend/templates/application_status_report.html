{% extends "global_layout.html" %}

{% block title %}Revenue Forecast Report{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
{% endblock %}

{% block content %}
<div class="report-main container-fluid">
  <div class="row g-3">
    <aside class="filters-panel col-lg-3">
      <h3 class="mb-3">Filters</h3>
      <div class="filter-group mb-3 time-filter">
        <label class="form-label fw-bold">Time Period</label>
        <div class="radio-group d-flex flex-column">
          <label><input type="radio" name="time" value="all" checked> All time</label>
          <label><input type="radio" name="time" value="today"> Today</label>
          <label><input type="radio" name="time" value="week"> This week</label>
          <label><input type="radio" name="time" value="month"> This month</label>
          <label><input type="radio" name="time" value="year"> This year</label>
          <label><input type="radio" name="time" value="custom"> Custom range</label>
        </div>
        <div class="date-range">
          <input type="text" class="time-range form-control form-control-sm" placeholder="Select range">
          <div class="mt-2 d-flex gap-2">
            <button type="button" class="btn btn-outline-primary btn-sm rounded-pill apply-range">Apply</button>
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill cancel-range">Cancel</button>
          </div>
        </div>
      </div>
      <div class="filter-group mb-3">
        <label class="form-label fw-bold" for="filter-status">Status</label>
        <select id="filter-status" class="form-select form-select-sm">
          <option value="">All statuses</option>
        </select>
      </div>
      <div class="filter-group mb-3">
        <label class="form-label fw-bold" for="filter-agent">Agent</label>
        <select id="filter-agent" class="form-select form-select-sm">
          <option value="">All agents</option>
        </select>
      </div>
      <div class="filter-group mb-3">
        <label class="form-label fw-bold" for="filter-course">Course Type</label>
        <select id="filter-course" class="form-select form-select-sm">
          <option value="">All course types</option>
        </select>
      </div>
      <div class="filter-group mb-3">
        <label class="form-label fw-bold" for="filter-visa">Visa Status</label>
        <select id="filter-visa" class="form-select form-select-sm">
          <option value="">All visa statuses</option>
        </select>
      </div>
      <div class="filter-group mb-3">
        <label class="form-label fw-bold">Sort by</label>
        <div class="sort-buttons d-flex flex-wrap gap-2">
          <button class="btn btn-outline-primary btn-sm" data-sort="revenue-desc">Revenue ↓</button>
          <button class="btn btn-outline-primary btn-sm" data-sort="revenue-asc">Revenue ↑</button>
          <button class="btn btn-outline-primary btn-sm" data-sort="students-desc">Students ↓</button>
          <button class="btn btn-outline-primary btn-sm" data-sort="students-asc">Students ↑</button>
        </div>
      </div>
    </aside>

    <section class="report-content col-lg-7">
      <h1 class="mb-3 text-center">Revenue Forecast Report</h1>
      <h2 class="h5 text-muted mb-4">Projected enrolment revenue for the next 12 months</h2>
      <canvas id="mainChart" class="mb-4" height="200"></canvas>
      <div class="table-responsive">
        <table id="dataTable" class="table table-bordered table-sm">
          <thead class="table-light">
            <tr><th>Month</th><th>Forecast Revenue</th><th>Students</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <aside class="chart-options col-lg-2">
      <h3 class="mb-3">Graphs and Charts</h3>
      <div class="d-flex flex-column gap-2">
        <button class="btn btn-outline-primary chart-btn active" data-type="line"><i class="fa-solid fa-chart-line me-1"></i>Line Chart</button>
        <button class="btn btn-outline-primary chart-btn" data-type="bar"><i class="fa-solid fa-chart-column me-1"></i>Bar Chart</button>
        <button class="btn btn-outline-primary chart-btn" data-type="table"><i class="fa-solid fa-table me-1"></i>Table</button>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/time_period_filter.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/revenue-forecast-report.js') }}" type="module"></script>
{% endblock %}
