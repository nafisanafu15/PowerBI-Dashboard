{% extends "global_layout.html" %}

{% block title %}Create Dashboard{% endblock %}

{% block content %}
<div class="container-fluid dashboard-page">
  <h1 class="mb-2">Create Dashboard</h1>

  <div class="action-bar mb-3">
    <button id="addChart" class="btn btn-primary">Add Chart</button>
    <button id="saveDashboard" class="btn btn-success ms-2">Save</button>
    <button id="resetDashboard" class="btn btn-outline-secondary ms-2">Reset</button>
    <button id="shareDashboard" class="btn btn-outline-primary ms-2">Share</button>
  </div>

  <div id="charts" class="custom-charts-grid"></div>

  <div class="modal fade" id="shareModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Share dashboard</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="shareFeedback" class="alert d-none" role="alert"></div>
          <form id="shareForm" novalidate>
            <div class="mb-3">
              <label for="shareRecipient" class="form-label">Recipient email</label>
              <input type="email" class="form-control" id="shareRecipient" name="recipient" placeholder="teammate@example.com" required>
              <div class="form-text">We will store the recipient email with the chart snapshots.</div>
            </div>
            <div class="mb-3">
              <label for="shareSubject" class="form-label">Subject <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="shareSubject" name="subject" maxlength="120" placeholder="Dashboard highlights">
            </div>
            <div class="mb-3">
              <label for="shareMessage" class="form-label">Message <span class="text-muted">(optional)</span></label>
              <textarea class="form-control" id="shareMessage" name="message" rows="3" placeholder="Add any additional notes for the recipient"></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="shareSubmit">Save share</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/custom_dashboard.js') }}"></script>
<script type="module" src="/static/js/constraints.js"></script>
{% endblock %}
