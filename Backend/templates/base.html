<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>

<body>
  {% block header %}
  {% include 'header.html' %}
  {% endblock %}
  {% block body %}{% endblock %}
  {% include 'footer.html' %}
  <button id="ai-chat-toggle" class="ai-chat__toggle" type="button" aria-label="Open analytics assistant"
    aria-expanded="false">
    <i class="fa-solid fa-comments"></i>
  </button>
  <section id="ai-chat-panel" class="ai-chat__panel" aria-live="polite" aria-hidden="true">
    <header class="ai-chat__header">
      <h3 class="mb-0">Analytics assistant</h3>
      <p class="mb-0">Ask about dashboards, AI insights, or getting help.</p>
    </header>
    <div id="ai-chat-messages" class="ai-chat__messages" role="log"></div>
    <div id="ai-chat-status" class="ai-chat__status" role="status"></div>
    <form id="ai-chat-form" class="ai-chat__form" novalidate>
      <label for="ai-chat-input" class="visually-hidden">Ask the analytics assistant</label>
      <div class="d-flex gap-2 align-items-end">
        <textarea id="ai-chat-input" class="form-control" placeholder="Type a question" aria-label="Type a question"
          required></textarea>
        <button type="submit" class="btn btn-primary px-3">
          <span class="d-none d-sm-inline">Send</span>
          <i class="fa-solid fa-paper-plane d-inline d-sm-none"></i>
        </button>
      </div>
    </form>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/button-colors.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ai-chat.js') }}" defer></script>
</body>

</html>
